name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / c++${{ matrix.standard }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        standard: ["17", "20"]
        compiler: [gcc]
        include:
          # MSVC on Windows is compiled here to prove portability only. It is
          # explicitly allowed to fail: the Windows toolchain is not yet proven
          # (see project-control/BLOCKED.md), so a failure is reported, not hidden.
          - { os: windows-latest, standard: "17", compiler: msvc, experimental: true }
          - { os: windows-latest, standard: "20", compiler: msvc, experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: AURA
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        working-directory: AURA
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: AURA
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke (aura --self-test persistence + recovery)
        working-directory: AURA
        shell: bash
        run: |
          BIN=build/aura
          if [ ! -x "$BIN" ]; then BIN=build/Release/aura; fi
          "$BIN" --self-test --store "$RUNNER_TEMP/aura_smoke.aura"

      - name: Install (packaging check)
        working-directory: AURA
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/aura-install"

  # Desktop GUI build + genuine interactive-runtime smoke on a headless runner.
  #
  # A Linux runner has software OpenGL + Xvfb, so this proves the render/window
  # lifecycle actually starts, draws frames and shuts down cleanly (not just that
  # it links). This is a bounded, software-rendered smoke: it does not prove a
  # human-verified Windows visual experience.
  desktop-gui:
    name: desktop-gui-linux (Dear ImGui + Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build/test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev xvfb

      - name: Configure (GUI enabled)
        working-directory: AURA
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DAURA_BUILD_GUI=ON

      - name: Build (all targets, incl. aura_gui)
        working-directory: AURA
        run: cmake --build build -j 4

      - name: Full test suite (incl. GuiSelfTest)
        working-directory: AURA
        run: ctest --test-dir build --output-on-failure

      - name: GUI headless integration smoke
        working-directory: AURA
        run: ./build/aura_gui --self-test --store "$RUNNER_TEMP/gui_smoke.aura"

      - name: GUI interactive-runtime smoke (bounded, Xvfb software OpenGL)
        working-directory: AURA
        run: |
          xvfb-run -a -s "-screen 0 1360x860x24" \
            timeout 60 ./build/aura_gui --gui --frames 120 --store "$RUNNER_TEMP/gui_live.aura"
          echo "GUI interactive smoke OK: window created, frames rendered, clean shutdown"

      - name: GUI modern-renderer pin smoke (proves the OpenGL 3.3 path)
        working-directory: AURA
        run: |
          xvfb-run -a -s "-screen 0 1360x860x24" \
            timeout 60 ./build/aura_gui --gui --renderer modern --frames 30 --store "$RUNNER_TEMP/gui_modern.aura" \
            | tee "$RUNNER_TEMP/modern.log"
          grep -q "renderer=MODERN_GL33" "$RUNNER_TEMP/modern.log"
          echo "Modern renderer smoke OK: OpenGL 3.3 core context created and rendered"

      - name: GUI legacy-renderer smoke (proves the OpenGL 2.1 fallback path)
        working-directory: AURA
        run: |
          # Force the legacy path (compatibility context, ImGui OpenGL2 backend).
          # This exercises the same code path used on hardware without GL 3.3
          # (e.g. Intel HD 3000) on a machine that has no such GPU, so the code is
          # TESTED but the specific hardware remains UNPROVEN.
          xvfb-run -a -s "-screen 0 1360x860x24" \
            timeout 60 ./build/aura_gui --gui --renderer legacy --frames 30 --store "$RUNNER_TEMP/gui_legacy.aura" \
            | tee "$RUNNER_TEMP/legacy.log"
          grep -q "renderer=LEGACY_GL21" "$RUNNER_TEMP/legacy.log"
          echo "Legacy renderer smoke OK: OpenGL 2.1 compatibility context created and rendered"

      - name: GUI auto-fallback smoke (modern unavailable -> legacy)
        working-directory: AURA
        run: |
          # Cap Mesa at GL 2.1 so the OpenGL 3.3 attempt genuinely fails; the AUTO
          # selector must then fall back to the legacy renderer instead of exiting.
          MESA_GL_VERSION_OVERRIDE=2.1 MESA_GLSL_VERSION_OVERRIDE=120 \
            xvfb-run -a -s "-screen 0 1360x860x24" \
            timeout 60 ./build/aura_gui --gui --frames 30 --store "$RUNNER_TEMP/gui_auto.aura" \
            | tee "$RUNNER_TEMP/auto.log"
          grep -q "renderer=LEGACY_GL21" "$RUNNER_TEMP/auto.log"
          grep -q "OpenGL 3.3 unavailable" "$RUNNER_TEMP/auto.log"
          echo "Auto-fallback smoke OK: modern failed, legacy fallback rendered"

  # Canonical Windows x64 Release package (self-contained aura.exe).
  windows-release:
    name: windows-x64-release-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release, x64, GUI enabled)
        working-directory: AURA
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DAURA_BUILD_GUI=ON

      - name: Build (Release, all targets incl. aura.exe + aura_gui.exe)
        working-directory: AURA
        run: cmake --build build --config Release -j 4

      - name: Full test suite
        working-directory: AURA
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate and show the executables
        working-directory: AURA
        shell: pwsh
        run: |
          $exe = "build\Release\aura.exe"
          if (!(Test-Path $exe)) { throw "aura.exe not found at $exe" }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime
          $gui = "build\Release\aura_gui.exe"
          if (!(Test-Path $gui)) { throw "aura_gui.exe not found at $gui" }
          Get-Item $gui | Format-List FullName, Length, LastWriteTime

      - name: GUI build smoke (headless integration path; no window in CI)
        working-directory: AURA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gui = (Resolve-Path "build\Release\aura_gui.exe").Path
          New-Item -ItemType Directory -Force -Path gui-smoke | Out-Null
          $store = Join-Path (Resolve-Path gui-smoke).Path "gui.aura"
          # Exercises the same runtime ownership, nine-timeframe projection,
          # shadow-only invariant, checkpoint and cross-process recovery report the
          # window uses. It does NOT open a window: interactive runtime is UNPROVEN
          # in this headless CI runner (see TEST_LOG.md).
          & $gui --self-test --store $store --keep
          if ($LASTEXITCODE -ne 0) { throw "aura_gui self-test failed ($LASTEXITCODE)" }
          Write-Host "GUI headless integration smoke OK"

      - name: EXE runtime smoke (startup / init / no duplicate copies)
        working-directory: AURA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "build\Release\aura.exe").Path
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $store = Join-Path (Resolve-Path smoke).Path "smoke.aura"

          Write-Host "== self-test (persist + in-process recovery) =="
          & $exe --self-test --store $store --keep
          if ($LASTEXITCODE -ne 0) { throw "self-test failed ($LASTEXITCODE)" }

          Write-Host "== recover (cross-process, from the kept store) =="
          & $exe --recover $store
          if ($LASTEXITCODE -ne 0) { throw "recover failed ($LASTEXITCODE)" }

          Write-Host "== dump + replay (real pipeline over canonical frames) =="
          $frames = Join-Path (Resolve-Path smoke).Path "frames.txt"
          & $exe --dump-frames $frames
          if ($LASTEXITCODE -ne 0) { throw "dump-frames failed ($LASTEXITCODE)" }
          & $exe --replay $frames --store (Join-Path (Resolve-Path smoke).Path "replay.aura")
          if ($LASTEXITCODE -ne 0) { throw "replay failed ($LASTEXITCODE)" }

          Write-Host "== bounded serve smoke: single instance, listens, accepts, stays up =="
          $serve = Start-Process -FilePath $exe -ArgumentList "--serve","12345","--store",$store -PassThru
          Start-Sleep -Seconds 2
          if ($serve.HasExited) { throw "serve exited immediately (code $($serve.ExitCode))" }
          $copies = @(Get-Process -Name aura -ErrorAction SilentlyContinue)
          Write-Host "aura processes running: $($copies.Count)"
          if ($copies.Count -ne 1) { throw "expected exactly 1 aura process, saw $($copies.Count)" }
          $client = New-Object System.Net.Sockets.TcpClient
          $client.Connect("127.0.0.1", 12345)
          $client.Close()
          Start-Sleep -Seconds 1
          if ($serve.HasExited) { throw "serve exited after client disconnect" }
          Stop-Process -Id $serve.Id -Force
          Write-Host "smoke OK: started, initialised, single instance, accepted a connection"

      - name: Stage package (GUI + console host + runtime files actually required)
        working-directory: AURA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\AURA_Windows_x64_GUI_Release"
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\Release\aura_gui.exe" (Join-Path $dist "aura_gui.exe")
          Copy-Item "build\Release\aura.exe" (Join-Path $dist "aura.exe")
          Copy-Item "README.md" (Join-Path $dist "README.md")
          # Ship the staged type roles and brand assets beside the exe so the
          # packaged GUI is fully self-contained (the build stages them under the
          # binary directory). A missing brand asset is tolerated: the header then
          # renders the ASTRA wordmark alone.
          $exeDir = Split-Path -Parent (Resolve-Path "build\Release\aura_gui.exe")
          foreach ($sub in @("fonts", "assets")) {
            $src = Join-Path $exeDir $sub
            if (Test-Path $src) {
              Copy-Item -Recurse -Force $src (Join-Path $dist $sub)
            }
          }
          # Both executables are self-contained (static CRT). The GUI additionally
          # uses the OS-provided opengl32.dll; no third-party DLL, data file or
          # config is required. The only file read/written at run time is the store
          # passed via --store. Record that in the package notes.
          @"
          AURA (shadow-only) - Windows x64 Release
          ========================================

          Contents:
            aura_gui.exe   desktop control center (Dear ImGui + GLFW + OpenGL)
            aura.exe       headless console host / diagnostics / CI smoke
            README.md      build + usage notes
            fonts/         terminal type roles (Roboto-Medium, Cousine-Regular)
            assets/brand/  optional ASTRA brand mark (loaded when present)

          Required runtime files: none beyond the files above. Both executables link
          the CRT statically and need no third-party DLLs or configuration.
          aura_gui.exe uses the OS-provided opengl32.dll. Neither reads an absolute
          developer path; the only file read/written is the persistence store you
          pass with --store (created on first use). The fonts/ and assets/ folders
          are read from next to aura_gui.exe; if a font or brand asset is absent the
          UI falls back to the built-in face / wordmark.

          Graphics: aura_gui.exe prefers an OpenGL 3.3 core context and, if the
          driver cannot provide one (e.g. legacy Intel HD Graphics 3000 on Windows),
          automatically falls back to an OpenGL 2.1 compatibility context using the
          ImGui OpenGL2 backend. The renderer actually in use is printed at startup
          (renderer=MODERN_GL33 or renderer=LEGACY_GL21) and shown in the status bar.
          If neither context can be created, aura_gui.exe exits with a clear,
          actionable error and points at the console host aura.exe (headless, no
          OpenGL required).

          Usage:
            aura_gui.exe --gui [--store <path>] [--serve <port>] [--replay <frames>]
                         [--renderer auto|modern|legacy]
            aura_gui.exe --self-test [--store <path>] [--keep]
            aura.exe     --self-test [--store <path>] [--keep]
            aura.exe     --replay <frames-file> [--store <path>]
            aura.exe     --serve <port> [--store <path>]
            aura.exe     --dump-frames <file>
            aura.exe     --recover <store-path>

          Execution mode: SHADOW ONLY. No live order path, no buy/sell controls.
          Interactive GUI runtime is verified only when actually exercised (see
          project-control/TEST_LOG.md); a headless CI runner proves the build and the
          integration path, not interactive rendering. The legacy fallback code is
          exercised in CI on software GL, but the specific Intel HD 3000 hardware is
          not available in CI and remains UNPROVEN. No profitability, calibration
          or production-safety claim.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dist "RUNNING.txt")
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Secret scan (fail if anything credential-shaped is staged)
        working-directory: AURA
        shell: pwsh
        run: |
          $patterns = @(
            'ghp_[A-Za-z0-9]{20,}', 'github_pat_[A-Za-z0-9_]{20,}',
            'sk-[A-Za-z0-9]{20,}', 'AKIA[0-9A-Z]{16}',
            'BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY',
            'xox[baprs]-[A-Za-z0-9-]{10,}', '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          )
          $hit = $false
          foreach ($f in Get-ChildItem -Recurse -File dist) {
            foreach ($p in $patterns) {
              if (Select-String -Path $f.FullName -Pattern $p -Quiet) {
                Write-Host "SECRET-LIKE MATCH in $($f.Name): $p"; $hit = $true
              }
            }
          }
          if ($hit) { throw "secret scan failed: credential-shaped content in package" }
          Write-Host "secret scan OK: no credential-shaped content in the package"

      - name: Create AURA_Windows_x64_GUI_Release.zip
        working-directory: AURA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist\AURA_Windows_x64_GUI_Release\*" `
            -DestinationPath "AURA_Windows_x64_GUI_Release.zip" -Force

      - name: Verify ZIP contents and executable presence
        working-directory: AURA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "AURA_Windows_x64_GUI_Release.zip"
          if (!(Test-Path $zip)) { throw "ZIP not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try { $names = $z.Entries | ForEach-Object { $_.FullName } } finally { $z.Dispose() }
          Write-Host "ZIP entries:"; $names | ForEach-Object { Write-Host "  $_" }
          if (-not ($names -contains "aura_gui.exe")) { throw "aura_gui.exe missing from ZIP" }
          if (-not ($names -contains "aura.exe")) { throw "aura.exe missing from ZIP" }
          # Normalise separators so the nested brand asset is checked regardless of
          # how the archive records path separators.
          $norm = $names | ForEach-Object { $_ -replace '\\', '/' }
          if (-not ($norm -contains "assets/brand/astra-mark.png")) {
            throw "assets/brand/astra-mark.png missing from ZIP"
          }
          # Extract and run the packaged executables to prove the artifacts work.
          $verify = "verify"
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $verify
          $packagedMark = Join-Path $verify "assets/brand/astra-mark.png"
          if (!(Test-Path $packagedMark)) { throw "extracted assets/brand/astra-mark.png missing" }
          Write-Host ("Brand asset staged: {0} ({1:N0} bytes)" -f `
            $packagedMark, (Get-Item $packagedMark).Length)
          $packaged = Join-Path $verify "aura.exe"
          if (!(Test-Path $packaged)) { throw "extracted aura.exe missing" }
          & $packaged --self-test --store (Join-Path (Resolve-Path $verify).Path "pkg.aura")
          if ($LASTEXITCODE -ne 0) { throw "packaged aura.exe smoke failed ($LASTEXITCODE)" }
          $packagedGui = Join-Path $verify "aura_gui.exe"
          if (!(Test-Path $packagedGui)) { throw "extracted aura_gui.exe missing" }
          & $packagedGui --self-test --store (Join-Path (Resolve-Path $verify).Path "pkggui.aura")
          if ($LASTEXITCODE -ne 0) { throw "packaged aura_gui.exe smoke failed ($LASTEXITCODE)" }
          $item = Get-Item $zip
          Write-Host ("ZIP: {0} ({1:N0} bytes)" -f $item.Name, $item.Length)
          $exeItem = Get-Item "build\Release\aura.exe"
          Write-Host ("EXE: {0} ({1:N0} bytes)" -f $exeItem.Name, $exeItem.Length)
          $guiItem = Get-Item "build\Release\aura_gui.exe"
          Write-Host ("GUI: {0} ({1:N0} bytes)" -f $guiItem.Name, $guiItem.Length)

      - name: Upload aura.exe + aura_gui.exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-windows-x64-exe
          path: |
            AURA/build/Release/aura.exe
            AURA/build/Release/aura_gui.exe

      - name: Upload AURA_Windows_x64_GUI_Release.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA_Windows_x64_GUI_Release
          path: AURA/AURA_Windows_x64_GUI_Release.zip

